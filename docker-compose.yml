# ─────────────────────────────────────────────────────────────
# Development docker-compose
# Service: nextjs (Next.js dev server con HMR)
# ─────────────────────────────────────────────────────────────

services:
  nextjs:
    build:
      context: .
      target: dev
    container_name: rbac_next_hub_dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules   # preserva node_modules del contenedor
    env_file:
      - .env.local
    ports:
      - "4000:4000"
    networks:
      - default
      - global

volumes:
  node_modules:

networks:
  global:
    external: true
